<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Animations -->
    <style>
      .pulse-slow {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .float-card-1 {
        animation: float1 5s ease-in-out infinite alternate;
      }
      .float-card-2 {
        animation: float2 6s ease-in-out infinite alternate;
      }
      .flow-dash {
        stroke-dasharray: 8, 8;
        animation: dash 20s linear infinite;
      }
      .glow-node {
        animation: nodePulse 3s ease-in-out infinite alternate;
      }
      .wave-sweep {
        animation: waveSweep 12s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes float1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(10px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes nodePulse {
        0% { r: 5; opacity: 0.5; }
        100% { r: 8; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      @keyframes waveSweep {
        0% { transform: translateX(-40px); }
        100% { transform: translateX(40px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Grid Pattern in background -->
  <g opacity="0.12">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200 M0,350 H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M100,0 V400 M200,0 V400 M300,0 V400 M400,0 V400 M500,0 V400 M600,0 V400 M700,0 V400 M800,0 V400 M900,0 V400 M1000,0 V400 M1100,0 V400" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Dynamic Ambient Glow Blobs (Behind everything) -->
  <circle cx="200" cy="100" r="180" fill="#3b82f6" opacity="0.18" filter="url(#glow)" class="pulse-slow"/>
  <circle cx="1020" cy="300" r="220" fill="#8b5cf6" opacity="0.16" filter="url(#glow)" class="pulse-slow"/>
  <circle cx="600" cy="380" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Dynamic Flow Lines & Visual Architecture (Background decorative) -->
  <g opacity="0.35" class="wave-sweep">
    <path d="M-50,320 C250,220 350,380 600,290 C850,200 950,360 1250,270" fill="none" stroke="url(#accent-grad)" stroke-width="2" class="flow-dash"/>
    <path d="M-50,340 C280,250 380,410 630,310 C880,220 980,380 1250,290" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" class="flow-dash"/>
  </g>

  <!-- Dynamic Background Floating Cards (Sides only - never obscuring text) -->
  <!-- Left Decorative Mini Card -->
  <g class="float-card-1" opacity="0.75" filter="url(#shadow)">
    <rect x="45" y="70" width="165" height="95" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
    <circle cx="70" cy="95" r="7" fill="#10b981"/>
    <text x="85" y="99" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Enterprise PPM</text>
    <rect x="70" y="116" width="115" height="6" rx="3" fill="#334155"/>
    <rect x="70" y="116" width="85" height="6" rx="3" fill="#38bdf8"/>
    <rect x="70" y="132" width="90" height="6" rx="3" fill="#334155"/>
    <rect x="70" y="132" width="55" height="6" rx="3" fill="#818cf8"/>
  </g>

  <!-- Right Decorative Mini Card -->
  <g class="float-card-2" opacity="0.75" filter="url(#shadow)">
    <rect x="990" y="225" width="165" height="105" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
    <circle cx="1015" cy="252" r="7" fill="#38bdf8"/>
    <text x="1030" y="256" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Self-Hosted</text>
    <!-- Mini Gantt / Sprint bars -->
    <rect x="1015" y="272" width="45" height="7" rx="3.5" fill="#6366f1"/>
    <rect x="1068" y="272" width="60" height="7" rx="3.5" fill="#10b981"/>
    <rect x="1015" y="288" width="80" height="7" rx="3.5" fill="#f59e0b"/>
    <rect x="1015" y="304" width="115" height="7" rx="3.5" fill="#334155"/>
    <rect x="1015" y="304" width="70" height="7" rx="3.5" fill="#ec4899"/>
  </g>

  <!-- Interactive Network Nodes (Subtle, animated) -->
  <g>
    <line x1="210" y1="120" x2="280" y2="180" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
    <circle cx="280" cy="180" r="5" fill="#38bdf8" class="glow-node"/>
    <line x1="990" y1="270" x2="920" y2="210" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
    <circle cx="920" cy="210" r="5" fill="#a855f7" class="glow-node"/>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed High Contrast & Clarity -->
  <!-- Top Category Pill / Badge -->
  <g filter="url(#shadow)">
    <rect x="420" y="42" width="360" height="34" rx="17" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="1.5"/>
    <circle cx="438" cy="59" r="5" fill="#10b981"/>
    <text x="452" y="64" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <!-- Subtle Backing Glow for Main Title to ensure 100% readability -->
  <text x="600" y="148" text-anchor="middle" fill="#030712" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" opacity="0.75" filter="url(#shadow)">
    ENTERPRISE WORK MANAGEMENT
  </text>
  <text x="600" y="146" text-anchor="middle" fill="url(#accent-grad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    ENTERPRISE WORK MANAGEMENT
  </text>

  <!-- Subtitle -->
  <text x="600" y="196" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="600" letter-spacing="0.2">
    Platform Ecosystem: Strategic Portfolio, Work OS &amp; Open-Source Alternatives
  </text>

  <text x="600" y="230" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    Self-Hosted Solutions • Data Sovereignty • Agile Delivery • Goal Tracking &amp; OKRs
  </text>

  <!-- Feature Pills in Center Bottom -->
  <g transform="translate(230, 275)" filter="url(#shadow)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="67.5" y="24" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🏢 SaaS Suites</text>

    <!-- Pill 2 -->
    <rect x="150" y="0" width="145" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="222.5" y="24" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🛡️ Self-Hosted</text>

    <!-- Pill 3 -->
    <rect x="310" y="0" width="140" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="380" y="24" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📊 Portfolios</text>

    <!-- Pill 4 -->
    <rect x="465" y="0" width="145" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="537.5" y="24" text-anchor="middle" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⚡ Agile Cycles</text>

    <!-- Pill 5 -->
    <rect x="625" y="0" width="115" height="38" rx="19" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="682.5" y="24" text-anchor="middle" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⭐ Open Source</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="450" y="348" width="300" height="3" rx="1.5" fill="url(#accent-grad)"/>
</svg>
